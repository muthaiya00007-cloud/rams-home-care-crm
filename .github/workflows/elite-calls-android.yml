name: Build Elite Calls Android APK
on:
  push:
    branches: [feature/elite-call-manager-android-apk-20261019]
    paths:
      - 'elite-call-manager-android/**'
      - '.github/workflows/elite-calls-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elite-call-manager-android
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Elite Calls APK
        uses: actions/upload-artifact@v4
        with:
          name: Elite-Calls-Android-APK
          path: elite-call-manager-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
