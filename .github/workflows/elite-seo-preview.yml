name: Verify live client call number
on:
  push:
    branches: [seo/public-page-metadata]
    paths: [.github/workflows/elite-seo-preview.yml]
permissions: {}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build preview from the active production source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const team = 'team_orNcv72hBmZmJQg5z46QJgz0';
          const project = 'prj_46DWPeHumybIj2KbDX3YJqGlFsG1';
          const host = 'www.elitehomecarenursing.com';
          async function api(path,body) {
            const response = await fetch('https://api.vercel.com'+path+'?teamId='+team,{redirect:'error',method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.VERCEL_TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
            if (!response.ok) throw Error('Vercel '+response.status+' on '+path.split('/')[2]);
            return response.json();
          }
          const id='dpl_6zomksNVHRd8iLX8mShJ6WUUXRLP';
          for(let attempt=0;attempt<60;attempt++){
            const dep=await api('/v13/deployments/'+id);
            const alias=await api('/v4/aliases/'+host);
            if(dep.readyState==='READY' && alias.deploymentId===id) break;
            if(['ERROR','CANCELED'].includes(dep.readyState)||attempt===59) throw Error('Production state '+dep.readyState+' '+(dep.errorMessage||'')+' alias '+alias.deploymentId);
            await new Promise(r=>setTimeout(r,4000));
          }
          const pages=['/','/home-care-trichy','/home-care-madurai','/home-care-pudukkottai','/home-care-salem','/home-care-thanjavur'];
          for(const city of ['trichy','madurai'])for(const svc of ['home-care','home-nursing','elder-care','patient-care'])pages.push('/services/'+svc+'-'+city);
          for(const page of pages){
            const res=await fetch('https://'+host+page+'?check='+id,{redirect:'error'});
            const html=await res.text();
            const calls=[...html.matchAll(/href="tel:([^"]+)"/g)];
            if(!res.ok||!calls.length||calls.some(m=>m[1]!=='+919994475537'))throw Error('Phone check failed '+page);
            console.log('Verified '+page);
          }
          NODE
