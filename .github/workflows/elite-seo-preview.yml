name: Verify Elite SEO preview
on:
  workflow_dispatch:
  push:
    branches: [seo/public-page-metadata]
    paths: [.github/workflows/elite-seo-preview.yml]
permissions: {}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build preview from the active production source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const team = 'team_orNcv72hBmZmJQg5z46QJgz0';
          const project = 'prj_46DWPeHumybIj2KbDX3YJqGlFsG1';
          const host = 'www.elitehomecarenursing.com';
          async function api(path,body) {
            const response = await fetch('https://api.vercel.com'+path+'?teamId='+team,{redirect:'error',method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.VERCEL_TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
            if (!response.ok) throw Error('Vercel '+response.status+' on '+path.split('/')[2]);
            return response.json();
          }
          if (!process.env.VERCEL_TOKEN) throw Error('VERCEL_TOKEN is missing');
          const alias=await api('/v4/aliases/'+host);
          if(alias.projectId!==project||!alias.deploymentId) throw Error('Unexpected production project');
          const dep=await api('/v13/deployments/'+alias.deploymentId);
          const settings=dep.projectSettings;
          if(settings?.outputDirectory!=='release-out'||!settings.buildCommand?.includes('cp seo-polish/*.html release-out/')) throw Error('Unexpected production build');
          const tree=await api('/v6/deployments/'+dep.id+'/files');
          if(tree.length!==1||tree[0].name!=='src') throw Error('Unexpected source tree');
          const files=[];
          function walk(nodes,prefix='') {
           for(const n of nodes) {
            if(n.type==='directory') walk(n.children,prefix+n.name+'/');
            else {if(!/^[0-9a-f]{40}$/.test(n.uid))throw Error('Invalid source reference'); files.push({file:prefix+n.name,sha:n.uid});}
           }
          }
          walk(tree[0].children);
          if(!files.some(x=>x.file==='crm-source.tar.gz')||files.some(x=>x.file==='apply-page-seo.cjs')) throw Error('Unexpected release inputs');
          files.push({file:'apply-page-seo.cjs',encoding:'base64',data:''});
          const request={name:dep.name,project,files,projectSettings:{buildCommand:settings.buildCommand+' && node apply-page-seo.cjs release-out',installCommand:settings.installCommand,outputDirectory:settings.outputDirectory,framework:settings.framework}};
          const preview=await api('/v13/deployments',request);
          console.log('Preview deployment '+preview.id+' https://'+preview.url);
          NODE
