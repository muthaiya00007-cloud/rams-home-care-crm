name: Verify original CRM deployment
on:
  push:
    branches: [verify/public-city-routes]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify original homepage and login
        shell: python
        run: |
          import urllib.request, urllib.error, re
          host="https://elite-home-care-requirements-4yiwu1946.vercel.app"
          for p in ["/","/admin/login","/admin/login.html","/services/patient-care-trichy"]:
              try:
                  with urllib.request.urlopen(host+p,timeout=15) as res:
                      html=res.read().decode()
                      print(p,res.status,"oldHome", 'id="gallery"' in html,"navLogin", 'href="/admin/login"' in html,"password", 'type="password"' in html,"chunks", '/_next/static/' in html, "finalHost",res.url.split('/')[2])
              except urllib.error.HTTPError as e: print(p,e.code)
