name: Verify public city landing pages
on:
  push:
    branches: [verify/public-city-routes]
permissions: {}
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check custom domain responses and call buttons
        shell: bash
        run: |
          failed=0
          for route in / /home-care-trichy /home-care-madurai /home-care-thanjavur /home-care-salem /home-care-pudukkottai /elite-city-assets/care-call.js /elite-city-assets/elite-hero-care-v2.jpg; do
            status=$(curl -LsS --max-time 12 -o /tmp/city.html -w '%{http_code}' "https://www.elitehomecarenursing.com$route") || status=000
            call=no
            if grep -Eq 'tel:[^"]*9994475537' /tmp/city.html; then call=yes; fi
            echo "$route HTTP=$status call=$call"
            if [[ $status != 200 ]]; then failed=1; fi
            if [[ $route != /elite-city-assets/* && $call != yes ]]; then failed=1; fi
          done
          exit "$failed"
